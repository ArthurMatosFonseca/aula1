name = "gerador-relatorios-sesi"
main = "src/index.js"
compatibility_date = "2026-10-10"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "gerador-sesi-db"
database_id = "PREENCHA_COM_O_ID_DO_D1"
migrations_dir = "migrations"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
